<!DOCTYPE html>
<html lang="de" class="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ressourcen-Lexikon Bedrock</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root {
  /* Layout: Kopfband mit Raster, darunter feste Suchleiste. Schmal: Liste oder Eintrag. Breit (ab 1100 px): Liste links als feste Spalte, Eintrag rechts. */
  --paper: #EDF1F6;
  --sheet: #FFFFFF;
  --ink: #13263F;
  --ink-soft: #55677F;
  --line: #CCD6E2;
  --accent: #0B5CAD;
  --on-accent: #FFFFFF;
  --mark: #C2410C;
  --tint: #E6EEF8;
  --band: #13263F;
  --band-ink: #F4F8FD;
  --band-soft: #A9BDD6;
  --band-line: rgba(255, 255, 255, .07);
  --slot: #E3E9F1;
  --shadow: 0 1px 2px rgba(19, 38, 63, .06), 0 8px 24px rgba(19, 38, 63, .07);
  --r: 14px;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --f-body: 'IBM Plex Sans', 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #09131F; --sheet: #101F33; --ink: #E6EEF8; --ink-soft: #9DB2CC; --line: #25405F;
    --accent: #74B4FF; --on-accent: #06121F; --mark: #FF9B61; --tint: #17304F;
    --band: #0D1C30; --band-ink: #F4F8FD; --band-soft: #9DB2CC; --band-line: rgba(255, 255, 255, .05);
    --slot: #0B1828; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #09131F; --sheet: #101F33; --ink: #E6EEF8; --ink-soft: #9DB2CC; --line: #25405F;
  --accent: #74B4FF; --on-accent: #06121F; --mark: #FF9B61; --tint: #17304F;
  --band: #0D1C30; --band-ink: #F4F8FD; --band-soft: #9DB2CC; --band-line: rgba(255, 255, 255, .05);
  --slot: #0B1828; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 84px; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
@media (min-width: 420px) and (max-width: 700px) { body { font-size: 17px; } }
h1, h2, h3, .eyebrow, .sub, .via, .lname, .ctitle, .catbtn, .pill, .badge { font-family: var(--f-display); }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; touch-action: manipulation; }
a, button, input { touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
[hidden] { display: none !important; }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

/* Kopfband */
.band { background-color: var(--band); background-image: linear-gradient(var(--band-line) 1px, transparent 1px), linear-gradient(90deg, var(--band-line) 1px, transparent 1px); background-size: 28px 28px; color: var(--band-ink); }
.band-in { max-width: 1360px; margin: 0 auto; padding: 26px 18px 30px; }
.eyebrow { font-size: .95rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #8CC2FF; margin: 0 0 6px; }
h1 { font-size: 2.7rem; line-height: 1; font-weight: 700; margin: 0; letter-spacing: .005em; text-wrap: balance; }
.lead { color: var(--band-soft); margin-top: 10px; max-width: 56ch; }

/* Suchleiste, bleibt oben stehen */
.bar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 84%, transparent); -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1360px; margin: 0 auto; padding: 10px 14px; display: flex; gap: 10px; align-items: center; }
.backbtn { flex: none; width: 52px; height: 52px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font-size: 1.9rem; line-height: 1; padding-bottom: 4px; box-shadow: var(--shadow); }
.backbtn:active { background: var(--tint); }
.searchbox { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--sheet); box-shadow: var(--shadow); cursor: text; }
.searchbox:focus-within { border-color: var(--accent); outline: 3px solid color-mix(in srgb, var(--accent) 22%, transparent); }
.searchbox svg { flex: none; width: 20px; height: 20px; color: var(--ink-soft); }
.searchbox input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 1.05rem; padding: 0; }
.searchbox input::placeholder { color: var(--ink-soft); }
.searchbox input::-webkit-search-cancel-button { -webkit-appearance: none; }
.clear { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--tint); color: var(--ink-soft); font-size: 1.1rem; line-height: 1; cursor: pointer; }
kbd { flex: none; font-family: var(--f-body); font-size: .78rem; padding: 2px 7px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink-soft); background: var(--paper); white-space: nowrap; }
@media (hover: none), (max-width: 700px) { kbd { display: none; } }

.shell { max-width: 1360px; margin: 0 auto; padding: 16px 14px calc(40px + env(safe-area-inset-bottom)); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.sub { font-size: .92rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 8px; font-weight: 600; }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.note { font-size: .9rem; color: var(--ink-soft); max-width: 65ch; }

/* Materialplättchen: eigene Kennzeichnung, keine Spielgrafik */
.tile { --c: #8D96A3; flex: none; display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-family: var(--f-display); font-weight: 700; background-color: var(--c); background-image: linear-gradient(135deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,0) 46%, rgba(0,0,0,.22) 100%); box-shadow: inset 0 0 0 1px rgba(19,38,63,.3), inset 0 1px 0 rgba(255,255,255,.4); border-radius: 24%; }
.tile.s { width: 16px; height: 16px; }
.tile.m { width: 32px; height: 32px; font-size: 1.1rem; }
.tile.l { width: 58px; height: 58px; font-size: 2rem; border-radius: 14px; }
/* Originalbilder: ersetzen das farbige Plättchen, sobald sie geladen sind */
.tile { position: relative; }
.tile.tx { background: none; box-shadow: none; }
.tile.tx .tm { display: none; }
.tile .txi { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.tile.tx.s .txi, .tile.tx.m .txi { filter: drop-shadow(0 1px 1px rgba(19, 38, 63, .25)); }
.txi image { image-rendering: crisp-edges; image-rendering: pixelated; }
.tile .tl { display: none; position: absolute; right: -5px; bottom: -5px; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 6px; background: var(--ink); color: var(--sheet);
  font: 700 .72rem/16px var(--f-display); text-align: center; box-shadow: 0 0 0 1.5px var(--sheet); }
.tile.tx .tl { display: block; }

/* Kategorien */
.catrow { max-width: 1360px; margin: 0 auto; padding: 14px 14px 0; }
.cats { display: flex; gap: 8px; overflow-x: auto; padding: 2px 14px 6px; margin: 0 -14px; scroll-snap-type: x proximity; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.catbtn { flex: none; scroll-snap-align: start; height: 44px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--sheet); color: var(--ink-soft); font-size: 1.08rem; font-weight: 600; letter-spacing: .01em; cursor: pointer; white-space: nowrap; }
.catbtn small { font-family: var(--f-body); font-weight: 400; font-size: .78rem; opacity: .8; margin-left: 5px; font-variant-numeric: tabular-nums; }
.catbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* Liste */
.listhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
h2 { font-size: 1.5rem; font-weight: 600; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.count { font-size: .88rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rows { list-style: none; margin: 8px 0 0; padding: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--sheet); box-shadow: var(--shadow); }
.rows li + li { border-top: 1px solid var(--line); }
.rows a { display: flex; align-items: center; gap: 12px; padding: 9px 12px; text-decoration: none; color: var(--ink); min-height: 54px; border-left: 3px solid transparent; }
.rows a:active, .rows a.kb { background: var(--tint); }
.rows a[aria-current="true"] { background: var(--tint); border-left-color: var(--mark); }
.rows .rn { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.rows .rc { flex: none; font-size: .78rem; color: var(--ink-soft); text-align: right; max-width: 38%; }
.more { align-self: center; min-height: 48px; padding: 0 20px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--sheet); cursor: pointer; font-weight: 600; margin-top: 12px; }
.empty { padding: 16px; color: var(--ink-soft); }

/* Eintrag */
.ititle { display: flex; align-items: flex-start; gap: 14px; }
.lname { font-size: 2.15rem; font-weight: 700; line-height: 1.04; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.badge { display: inline-flex; align-items: center; min-height: 26px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; font-size: .92rem; letter-spacing: .03em; color: var(--ink-soft); font-weight: 500; white-space: nowrap; background: var(--paper); }
.badge.main { border-color: var(--mark); background: var(--mark); color: #fff; font-weight: 600; }
:root[data-theme="dark"] .badge.main { color: #1A0E05; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge.main { color: #1A0E05; } }
.wiki { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-top: 10px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 999px; font-size: .95rem; font-weight: 600; text-decoration: none; background: var(--sheet); }

/* Herkunftsdiagramm */
.tree { overflow-x: auto; padding: 2px 2px 6px; }
.tn { min-width: 0; }
.nd { display: inline-flex; align-items: center; gap: 9px; padding: 7px 12px 7px 9px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); text-decoration: none; color: var(--ink); font-weight: 600; min-height: 44px; max-width: 100%; }
.nd.root { border: 2px solid var(--accent); background: var(--sheet); box-shadow: var(--shadow); }
.nd.tag { border-style: dashed; font-weight: 500; }
.nd .nn { overflow-wrap: anywhere; }
.nd .x { font-weight: 500; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hint { font-size: .86rem; color: var(--ink-soft); margin: 4px 0 0 3px; max-width: 36ch; overflow-wrap: anywhere; }
.via { display: inline-block; margin: 8px 0 0 0; padding: 1px 10px; border-radius: 999px; background: color-mix(in srgb, var(--mark) 13%, transparent); font-size: .9rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mark); line-height: 1.7; }
.kids { list-style: none; margin: 0 0 0 12px; padding: 0; }
.kids > li { position: relative; padding: 10px 0 0 22px; min-width: 210px; }
.kids > li::before { content: ''; position: absolute; left: 0; top: 0; width: 16px; height: 33px; border-left: 2px solid var(--mark); border-bottom: 2px solid var(--mark); border-bottom-left-radius: 10px; }
.kids > li::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; border-left: 2px solid var(--mark); }
.kids > li:last-child::after { display: none; }
.alt { font-size: .86rem; color: var(--ink-soft); margin: 6px 0 0 34px; max-width: 36ch; overflow-wrap: anywhere; }

/* Quellen */
.srcs { display: grid; grid-template-columns: 1fr; gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--paper); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.is-main { border-color: var(--mark); box-shadow: inset 4px 0 0 var(--mark); }
.chead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.ctitle { font-size: 1.2rem; font-weight: 600; letter-spacing: .02em; }
.card p { max-width: 65ch; }
.bench { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.grid { --s: 46px; display: grid; gap: 4px; width: max-content; padding: 6px; border-radius: 10px; background: var(--slot); box-shadow: inset 0 1px 3px rgba(19,38,63,.18); }
.gc { width: var(--s); height: var(--s); border-radius: 7px; background: var(--sheet); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px var(--line); }
.gc .tile { width: 34px; height: 34px; font-size: 1.15rem; }
.result { display: flex; align-items: center; gap: 8px; }
.result .rx { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.op { font-family: var(--f-display); font-weight: 700; color: var(--mark); font-size: 1.4rem; line-height: 1; }
.key { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.key li { display: flex; align-items: center; gap: 10px; }
.key .tile { width: 26px; height: 26px; font-size: .95rem; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px 5px 7px; border: 1px solid var(--line); border-radius: 999px; background: var(--sheet); text-decoration: none; color: var(--ink); font-size: .95rem; min-height: 40px; }
span.chip { color: var(--ink-soft); border-style: dashed; }
.tbl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tbl li { padding: 9px 0; border-top: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.tbl li:first-child { border-top: 0; padding-top: 0; }
.tbl .lr { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.tbl .ln { font-weight: 500; overflow-wrap: anywhere; }
.tbl .lw { font-size: .85rem; color: var(--ink-soft); }
.pill { flex: none; padding: 2px 10px; border-radius: 999px; background: var(--tint); font-size: .95rem; font-weight: 600; letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.toggle { align-self: flex-start; min-height: 44px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--sheet); cursor: pointer; font-weight: 600; font-size: .95rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.tbl .ln a, .lk { color: var(--accent); text-decoration: none; }
.tbl .ln a:hover, .lk:hover { text-decoration: underline; }
.catlink { display: inline-flex; align-items: center; text-decoration: none; border-style: dashed; color: var(--accent); }
.calcrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 4px 0 14px; }
.calcrow label { font-weight: 600; }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--sheet); }
.stepper button { width: 44px; height: 44px; border: 0; background: transparent; font-size: 1.4rem; line-height: 1; cursor: pointer; color: var(--ink); }
.stepper button:hover { background: var(--tint); }
.stepper input { width: 84px; height: 44px; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); text-align: center; font: 600 1.1rem var(--f-body);
  background: transparent; color: var(--ink); -moz-appearance: textfield; appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.need { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin: 0 0 14px; padding: 0; list-style: none; }
.need a { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--ink); background: var(--sheet); min-height: 52px; }
.need a:hover { border-color: var(--accent); }
.need b { font: 700 1.25rem var(--f-display); font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: right; }
.need span { min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }
.tolist { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin-top: 12px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--accent);
  background: var(--sheet); color: var(--accent); font: 600 1rem var(--f-display); letter-spacing: .02em; cursor: pointer; }
.tolist:hover { background: var(--tint); }
.calc h3 { font: 600 .95rem var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: 4px 0 8px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; list-style: none; margin: 0; padding: 0; }
.pgrid a { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--ink); background: var(--sheet); min-height: 48px; }
.pgrid a:hover { border-color: var(--accent); }
.pgrid small { color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.fx { margin: 0; font-size: 1.05rem; max-width: 65ch; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 14px 0 0; }
.facts dt { font-weight: 600; color: var(--ink-soft); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.facts .lv { display: inline-block; white-space: nowrap; margin-right: 12px; }
.facts a { color: var(--accent); }
@media (max-width: 560px) { .facts { grid-template-columns: minmax(0, 1fr); gap: 2px 0; } .facts dd { margin-bottom: 10px; } }
.foot { max-width: 1360px; margin: 0 auto; padding: 0 16px calc(28px + env(safe-area-inset-bottom)); font-size: .84rem; color: var(--ink-soft); }
.foot p { max-width: 75ch; border-top: 1px solid var(--line); padding-top: 12px; }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#detail .panel { animation: rise .26s ease both; }
#detail .panel:nth-child(2) { animation-delay: .04s; }
#detail .panel:nth-child(3) { animation-delay: .08s; }
#detail .panel:nth-child(4) { animation-delay: .12s; }
@media (prefers-reduced-motion: reduce) { #detail .panel { animation: none; } }

/* Maus und Tastatur */
@media (hover: hover) {
  .rows a:hover { background: var(--tint); }
  .catbtn:hover { border-color: var(--accent); color: var(--ink); }
  .catbtn[aria-pressed="true"]:hover { color: var(--on-accent); }
  .nd:hover, .chip:hover, .wiki:hover, .toggle:hover, .more:hover, .backbtn:hover { border-color: var(--accent); }
  a.chip:hover, a.nd:hover { background: var(--tint); }
  .key a:hover, .card p a:hover, .alt a:hover { text-decoration-thickness: 2px; }
}

/* Mittlere Breite: Quellen zweispaltig */
@media (min-width: 760px) {
  .band-in { padding: 34px 28px 38px; }
  .bar-in { padding: 12px 28px; }
  .shell { padding: 20px 28px 48px; }
  .foot { padding: 0 28px 32px; }
  h1 { font-size: 3.3rem; }
  .srcs { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); align-items: start; }
  .catrow { padding: 18px 28px 0; }
  .cats { margin: 0 -28px; padding: 2px 28px 6px; }
}

/* Breit, zum Beispiel Windows-Desktop: Liste links, Eintrag rechts */
@media (min-width: 1100px) {
  :root { --r: 10px; }
  .shell { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 24px; align-items: start; }
  #home { position: sticky; top: 86px; max-height: calc(100vh - 102px); max-height: calc(100dvh - 102px); overflow-y: auto; padding: 2px 8px 12px 2px; }
  #home[hidden] { display: block !important; }
  #detail[hidden] { display: block !important; }
  #hero, .backbtn { display: none !important; }
  #catrow[hidden] { display: block !important; }
  .cats { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; }
  .catbtn { height: 36px; font-size: 1rem; padding: 0 12px; }
  .rows a { min-height: 46px; padding: 6px 12px; }
  .tile.m { width: 28px; height: 28px; font-size: 1rem; }
  .lname { font-size: 2.6rem; }
  .nd { min-height: 38px; }
  .chip { min-height: 34px; }
  .searchbox, .backbtn { height: 48px; }
  .searchbox { max-width: 640px; }
}
</style>
<style id="app-style">@media (max-width: 720px) { html.app body::after { content: ""; display: block; height: calc(104px + env(safe-area-inset-bottom, 0px)); } }</style>
</head>
<body>

<header class="band">
  <div class="band-in">
    <p class="eyebrow" id="eyebrow">Minecraft Bedrock Edition</p>
    <h1>Ressourcen-Lexikon</h1>
    <p class="lead" id="lead"></p>
  </div>
</header>

<div class="bar">
  <div class="bar-in">

 Ein bestätigter Fehlerbericht der Bedrock Edition (MCPE-180499) meldet, dass ominöse Tresore Bücher mit Windschuss, Dichte und Bresche nicht auswerfen."}},"x":{"gold_nugget":"Fällt auch beim Abbau von [[nether_gold_ore]] und als Beute von Zombifizierter Piglin.","potent_sulfur":"Liegt auch am Grund der Tümpel in Schwefelhöhlen und Schwefelquellen. Nicht ins Wasser darüber steigen: Das Gas trübt die Sicht.","creaking_heart":"Sitzt natürlich in Blasseichen des Blassen Gartens. Als Block nur mit Behutsamkeit.","wither_skeleton_skull":"Seltene Beute: Die Chance liegt bei 2,5 % und steigt mit der Verzauberung Plünderung.","enchanted_book":"Am [[anvil]] überträgst du das Buch auf einen passenden Gegenstand. Zwei gleiche Bücher derselben Stufe ergeben dort die nächste Stufe. Am [[grindstone]] wird daraus wieder ein normales Buch, dabei gibt es etwas Erfahrung zurück. Preis beim Bibliothekar: 2 + 3 × Stufe Smaragde plus ein Zufallsaufschlag von 0 bis 5 + 10 × Stufe, bei Schatzverzauberungen doppelt, höchstens 64. Dazu immer 1 [[book]].","goat_horn":"Es gibt acht Klänge. Sinnieren, Singen, Suchen und Fühlen kommen von normalen Ziegen und aus Truhen in Plünderer-Außenposten. Bewundern, Rufen, Sehnen und Traum lassen nur schreiende Ziegen fallen.","suspicious_stew":"Die Blume bestimmt den Effekt: [[poppy]] und [[torchflower]] Nachtsicht, [[cornflower]] Sprungverstärkung, alle Tulpen Schwäche, [[azure_bluet]] und [[open_eyeblossom]] Blindheit, [[lily_of_the_valley]] Vergiftung, [[dandelion]], [[golden_dandelion]] und [[blue_orchid]] Sättigung, [[allium]] Feuerresistenz, [[oxeye_daisy]] Regeneration, [[wither_rose]] Wither, [[closed_eyeblossom]] Übelkeit. Fütterst du eine braune Pilzkuh mit einer dieser Blumen und benutzt danach eine [[bowl]] an ihr, bekommst du die passende Suppe.","ominous_bottle":"Trinken gibt den Effekt Drohendes Unheil, je nach Flasche Stufe I bis V. Betrittst du damit ein Dorf, wird daraus Überfall-Omen und ein Überfall beginnt. In Prüfungskammern wird da     var s = '<section class="panel"><p class="sub">Steckbrief</p><dl class="facts">';
    if (m.hp) s += '<dt>Lebenspunkte</dt><dd>' + span(m.hp) + ' (' + (m.hp[0] === m.hp[1] ? num(m.hp[0] / 2) : num(m.hp[0] / 2) + ' bis ' + num(m.hp[1] / 2)) + ' Herzen)</dd>';
    if (m.a) s += '<dt>Nahkampf</dt><dd>' + span(m.a) + ' Schaden pro Treffer, Grundwert ohne Schwierigkeitsgrad</dd>';
    if (m.x) s += '<dt>Erfahrung</dt><dd>' + span(m.x) + (m.x[2] ? ', mehr wenn er Ausrüstung trägt' : '') + '</dd>';
    var sp = m.s;
    if (sp && sp.w) s += '<dt>Erscheint</dt><dd>' + sp.w.map(function (w) { return WHERE[w] || w; }).join(', ') + '</dd>';
    if (sp && sp.l) s += '<dt>Licht</dt><dd>bei Lichtstufe ' + span(sp.l) + '</dd>';
    if (sp && sp.g) s += '<dt>Gruppen</dt><dd>' + (sp.g[0] === sp.g[1] ? (['', 'einzeln', 'zu zweit', 'zu dritt', 'zu viert', 'zu fünft', 'zu sechst'][sp.g[0]] || 'zu ' + sp.g[0]) : span(sp.g) + ' zusammen') + '</dd>';
    if (sp && sp.h) s += '<dt>Höhe</dt><dd>Y ' + span(sp.h) + '</dd>';
    if (!sp) s += '<dt>Erscheint</dt><dd>nicht von selbst wie andere Mobs, sondern an bestimmten Orten oder Ereignissen</dd>';
    return s + '</dl><p class="note" style="margin:14px 0 0">Werte aus Mojangs Verhaltensdateien, Kennung minecraft:' + esc(m.e) + '.</p></section>';
  }
  function special(h) {
    var s = '<div class="stack">', m;
    if (h === 'orte') {
      s += head('Fundorte', 'Truhen, Mobs und andere Quellen. Tippe einen Ort an, dann siehst du alles, was es dort gibt.', [Object.keys(BYPLACE).length + ' Orte']);
      KORDER.forEach(function (k) {
        var list = D.labels.map(function (l, n) { return [l, n]; }).filter(function (x) { return x[0][0] === k && BYPLACE[x[1]]; })
          .sort(function (a, b) { return a[0][1].localeCompare(b[0][1], 'de'); });
        if (!list.length) return;
        s += '<section class="panel"><p class="sub">' + KIND[k] + ' · ' + list.length + '</p><ul class="pgrid">' + list.map(function (x) {
          return '<li><a href="#ort-' + x[1] + '"><span>' + esc(x[0][1]) + '</span><small>' + BYPLACE[x[1]].length + '</small></a></li>'; }).join('') + '</ul></section>';
      });
      return { html: s + '</div>', title: 'Fundorte' };
    }
    if ((m = /^ort-(\d+)$/.exec(h)) && D.labels[+m[1]]) {
      var L = D.labels[+m[1]], items = (BYPLACE[+m[1]] || []).slice().sort(byName);
      s += head(L[1], L[2], [KIND[L[0]], items.length + (items.length === 1 ? ' Gegenstand' : ' Gegenstände')]);
      if (L[0] === 'mob') s += mobPanel(m[1]);
      s += '<section class="panel"><p class="sub">Das gibt es hier</p><ul class="tbl">' + items.map(function (x) {
        return row('<a href="#' + slug(x[0]) + '">' + esc(nm(x[0])) + '</a>', '', rng(x[1], x[2]) + ' Stück', false); }).join('') + '</ul>' +
        '<p class="note" style="margin-top:12px"><a class="lk" href="#orte">Alle Fundorte</a></p></section>';
      return { html: s + '</div>', title: L[1] };
    }
    if (h === 'berufe') {
      s += head('Dorfbewohner', 'Alle Berufe mit ihren Handelsangeboten. Tippe einen Beruf an.', [D.profs.length + ' Berufe']);
      s += '<section class="panel"><ul class="pgrid">' + D.profs.map(function (p, n) { return [p, n]; }).filter(function (x) { return BYPROF[x[1]]; })
        .sort(function (a, b) { return a[0][0].localeCompare(b[0][0], 'de'); }).map(function (x) {
          return '<li><a href="#beruf-' + x[1] + '"><span>' + esc(x[0][0]) + '</span><small>' + BYPROF[x[1]].length + ' Angebote</small></a></li>'; }).join('') + '</ul></section>';
      return { html: s + '</div>', title: 'Dorfbewohner' };
    }
    if ((m = /^beruf-(\d+)$/.exec(h)) && D.profs[+m[1]]) {
      var P = D.profs[+m[1]], offers = BYPROF[+m[1]] || [], lvs = {};
      offers.forEach(function (o) { (lvs[o[2][1]] = lvs[o[2][1]] || []).push(o); });
      s += head(P[0], P[1] ? 'Arbeitsblock: ' + nm(P[1]) + '. Ein Dorfbewohner ohne Beruf bekommt diesen Beruf, wenn er den Arbeitsblock für sich beansprucht.' : 'Erscheint gelegentlich in deiner Nähe und verschwindet nach einiger Zeit wieder.', [offers.length + ' Angebote']);
      Object.keys(lvs).sort(function (a, b) { return a - b; }).forEach(function (lv) {
        var b = lvs[lv].filter(function (o) { return o[0] === 'b'; }).sort(function (x, y) { return nm(x[1]).localeCompare(nm(y[1]), 'de'); }),
            v = lvs[lv].filter(function (o) { return o[0] === 's'; }).sort(function (x, y) { return nm(x[1]).localeCompare(nm(y[1]), 'de'); });
        s += '<section class="panel"><p class="sub">' + (+lv ? 'Stufe ' + lv + ' · ' + LV[+lv] : 'Angebote') + '</p><div class="srcs">';
        if (b.length) s += '<div class="card"><div class="chead"><span class="ctitle">Verkauft dir</span></div><ul class="tbl">' + b.map(function (o) {
          return row('<a href="#' + slug(o[1]) + '">' + esc(nm(o[1])) + '</a>', 'Preis: ' + o[2][2].map(function (w) { return rng(w[1][0], w[1][1]) + ' × ' + esc(nm(w[0])); }).join(' + '),
            rng(o[2][3][0], o[2][3][1]) + ' Stück', false); }).join('') + '</ul></div>';
        if (v.length) s += '<div class="card"><div class="chead"><span class="ctitle">Kauft dir ab</span></div><ul class="tbl">' + v.map(function (o) {
          return row('<a href="#' + slug(o[1]) + '">' + esc(nm(o[1])) + '</a>', 'Dafür gibt es ' + rng(o[2][3][0], o[2][3][1]) + ' × ' + esc(nm('emerald')),
            rng(o[2][2][0], o[2][2][1]) + ' Stück', false); }).join('') + '</ul></div>';
        s += '</div></section>';
      });
      s += '<p class="note"><a class="lk" href="#berufe">Alle Dorfbewohner</a></p>';
      return { html: s + '</div>', title: P[0] };
    }
    return null;
  }

  /* ---------- Verzauberungen ---------- */
  var ROMAN = ['', 'I', 'II', 'III', 'IV', 'V'];
  var ENCH = Object.keys(D.ench || {}).sort(function (a, b) { return I[a][0].localeCompare(I[b][0], 'de'); });
  function enchPanel(id) {
    var en = (D.ench || {})[id];
    if (id === 'enchanted_book') {
      return '<section class="panel"><p class="sub">Alle Verzauberungen · ' + ENCH.length + '</p><div class="chips">' +
        ENCH.map(function (x) { return '<a class="chip" href="#' + slug(x) + '">' + tile(x, 's') + esc(I[x][0]) + ' ' + ROMAN[D.ench[x].m] + '</a>'; }).join('') + '</div></section>';
    }
    if (!en) return '';
    var price = en.td ? en.pr.map(function (p, n) { return '<span class="lv">Stufe ' + ROMAN[n + 1] + ': ' + (p[0] === p[1] ? p[0] : p[0] + ' bis ' + p[1]) + '</span>'; }).join('') +
      '<br><span class="note">Smaragde, dazu 1 ' + esc(nm('book')) + '. Der Bibliothekar bietet eine zufällige Stufe an.</span>' : 'Wird nicht gehandelt';
    var table = en.tb ? 'Ja, auf ein Buch oder direkt auf einen passenden Gegenstand' : (en.tr ? 'Nein, das ist eine Schatzverzauberung' : 'Nein');
    return '<section class="panel"><p class="sub">Verzauberung</p><p class="fx">' + esc(en.fx) + '</p><dl class="facts">' +
      '<dt>Höchststufe</dt><dd>' + ROMAN[en.m] + '</dd>' +
      '<dt>Passt auf</dt><dd>' + esc(en.on) + '</dd>' +
      '<dt>Zaubertisch</dt><dd>' + table + '</dd>' +
      '<dt>Bibliothekar</dt><dd>' + price + '</dd>' +
      (en.ex.length ? '<dt>Nicht kombinierbar mit</dt><dd>' + en.ex.map(function (x) { return '<a href="#' + slug(x) + '">' + esc(I[x][0]) + '</a>'; }).join(', ') + '</dd>' : '') +
      '</dl><p class="note" style="margin:14px 0 0">Am ' + '<a href="#' + slug('anvil') + '">' + esc(nm('anvil')) + '</a> überträgst du das Buch auf einen passenden Gegenstand. ' +
      'Zwei gleiche Bücher derselben Stufe ergeben dort die nächste Stufe, bis zur Höchststufe.</p></section>';
  }

  /* ---------- Eintrag ---------- */
  function renderDetail(id) {
    var it = I[id], p = primary(id), s = '<div class="stack">';
    s += '<section class="panel"><div class="ititle">' + tile(id, 'l') + '<div style="min-width:0"><div class="lname">' + esc(nm(id)) + '</div><div class="meta"><span class="badge">' + esc(D.cats[it[2]]) + '</span>' +
         (id.indexOf(':') < 0 ? '<span class="badge">minecraft:' + esc(id) + '</span>' : '') + (it[1] ? '<span class="badge">Englisch: ' + esc(it[1]) + '</span>' : '') + '</div>' +
         (it[1] ? '<a class="wiki" href="https://minecraft.wiki/w/Special:Search?search=' + encodeURIComponent(it[1].replace(/\s*\((extended|level II|level IV)\)$/, '')) + '">Originalbild im Minecraft Wiki ↗</a>' : '') + '</div></div></section>';
    s += enchPanel(id);
    s += '<section class="panel"><p class="sub">Herkunft</p><div class="tree">' + renderNode(buildTree(id), true) + '</div></section>';
    s += calcPanel(id);

    s += '<section class="panel"><p class="sub">So bekommst du es</p><div class="srcs">';
    if (NAT[id]) s += '<div class="card' + (p.t === 'n' ? ' is-main' : '') + '"><div class="chead"><span class="ctitle">Fundort und Gewinnung</span>' + (p.t === 'n' ? '<span class="badge main">Hauptweg</span>' : '') + '</div><p>' + linkify(NAT[id].t) + '</p></div>';
    var rec = (byOut[id] || []).slice(), main = D.pr[id];
    var KO = { c: 0, l: 0, f: 1, m: 2, b: 2, k: 3, s: 4 };
    rec.sort(function (a, b) { return (a === main ? -1 : 0) - (b === main ? -1 : 0) || KO[R[a].k] - KO[R[b].k] || a - b; });
    rec.forEach(function (n, k) {
      var card = recipeCard(R[n], n === main && p.t === 'r', id);
      s += k >= 2 ? '<div class="xtra" hidden>' + card + '</div>' : card;
    });
    if (D.x[id]) s += '<div class="card"><div class="chead"><span class="ctitle">Hinweis</span></div><p>' + linkify(D.x[id]) + '</p></div>';
    s += lootCards(id) + tradeCards(id) + '</div>';
    if (rec.length > 2) s += '<button type="button" class="toggle" data-more style="margin-top:12px">Weitere ' + (rec.length - 2) + ' Rezepte anzeigen</button>';
    s += '</section>';

    var u = Object.keys(uses[id] || {}).sort(function (a, b) { return nm(a).localeCompare(nm(b), 'de'); });
    s += '<section class="panel"><p class="sub">Wird gebraucht für' + (u.length ? ' · ' + u.length : '') + '</p>';
    if (u.length) {
      s += '<div class="chips">' + u.map(function (x, n) { return n >= 18 ? '<span class="xtra" hidden>' + chip(x, 1) + '</span>' : chip(x, 1); }).join('') + '</div>';
      if (u.length > 18) s += '<button type="button" class="toggle" data-more style="margin-top:12px">Alle ' + u.length + ' anzeigen</button>';
    } else s += '<p class="note">Wird für kein Rezept gebraucht.</p>';
    s += '</section></div>';
    $('detail').innerHTML = s;
  }

  /* ---------- Liste ---------- */
  var st = { q: '', cat: -1, shown: 40, kb: -1, current: null };
  var SORTED = IDS.slice().sort(function (a, b) { return nm(a).localeCompare(nm(b), 'de'); });
  var FOLD = {}; IDS.forEach(function (id) { FOLD[id] = [fold(I[id][0]), fold(I[id][1] || ''), id.replace(/_/g, ' ')]; });
  var lastMatches = [];
  function matches() {
    var q = fold(st.q.trim()), out = [];
    var q2 = q.replace(/ae/g, 'a').replace(/oe/g, 'o').replace(/ue/g, 'u');
    SORTED.forEach(function (id) {
      if (st.cat >= 0 && I[id][2] !== st.cat) return;
      if (!q) { out.push([id, 9]); return; }
      var f = FOLD[id], score = 99;
      [q, q2].forEach(function (x) {
        var i = f[0].indexOf(x);
        if (i === 0) score = Math.min(score, 0);
        else if (i > 0 && /[\s\-:(]/.test(f[0].charAt(i - 1))) score = Math.min(score, 1);
        else if (i > 0) score = Math.min(score, 2);
        else if (f[1].indexOf(x) >= 0 || f[2].indexOf(x) >= 0) score = Math.min(score, 3);
      });
      if (score < 99) out.push([id, score]);
    });
    if (q) out.sort(function (a, b) { return a[1] - b[1]; });
    return out.map(function (x) { return x[0]; });
  }
  function renderList() {
    var m = lastMatches = matches(), n = Math.min(st.shown, m.length);
    if (st.kb >= n) st.kb = n - 1;
    $('listtitle').textContent = st.q.trim() ? 'Treffer' : (st.cat >= 0 ? D.cats[st.cat] : 'Alle Ressourcen');
    $('count').textContent = m.length.toLocaleString('de-DE') + (m.length === 1 ? ' Ressource' : ' Ressourcen');
    $('rows').innerHTML = m.length ? m.slice(0, n).map(function (id, k) {
      return '<li><a href="#' + slug(id) + '"' + (id === st.current ? ' aria-current="true"' : '') + (k === st.kb ? ' class="kb"' : '') + '>' + tile(id, 'm') +
        '<span class="rn">' + esc(nm(id)) + '</span><span class="rc">' + esc(D.cats[I[id][2]]) + '</span></a></li>';
    }).join('') : '<li class="empty">Nichts gefunden. Prüfe die Schreibweise oder suche nach dem englischen Namen.</li>';
    $('more').hidden = n >= m.length;
    $('hero').hidden = !!st.q.trim() || st.cat >= 0;
    $('clear').hidden = !st.q;
  }
  function renderCats() {
    var cnt = D.cats.map(function () { return 0; });
    IDS.forEach(function (id) { cnt[I[id][2]]++; });
    var s = '<button type="button" class="catbtn" data-c="-1" aria-pressed="' + (st.cat < 0) + '">Alle<small>' + IDS.length + '</small></button>';
    D.cats.forEach(function (c, i) { if (cnt[i]) s += '<button type="button" class="catbtn" data-c="' + i + '" aria-pressed="' + (st.cat === i) + '">' + esc(c) + '<small>' + cnt[i] + '</small></button>'; });
    s += '<a class="catbtn catlink" href="#orte">Fundorte ›</a><a class="catbtn catlink" href="#berufe">Dorfbewohner ›</a>';
    $('cats').innerHTML = s;
  }
  function renderHero() {
    $('hero').innerHTML = '<p class="sub">Beispiel</p><div class="chead" style="margin-bottom:10px"><span class="ctitle" style="font-size:1.35rem">Woher kommt ' + esc(nm(DEFAULT)) + '?</span></div>' +
      '<div class="tree">' + renderNode(buildTree(DEFAULT, 12), true) + '</div>' +
      '<p class="note" style="margin-top:10px">So sieht jeder Eintrag aus: oben die Herkunft als Kette, darunter Rezept, Fundort, Beute, Handel und Verwendung. Jedes Kästchen lässt sich antippen.</p>';
  }

  /* ---------- Navigation ---------- */
  var listScroll = 0;
  function barH() { return document.querySelector('.bar').offsetHeight; }
  function toDetailTop() {
    var y = $('detail').getBoundingClientRect().top + window.scrollY - barH() - 12;
    if (window.scrollY > y) window.scrollTo(0, Math.max(0, y));
  }
  function route() {
    var h = location.hash.replace(/^#/, ''), sp = /^(orte|berufe|ort-\d+|beruf-\d+)$/.test(h) ? special(h) : null,
        id = !sp && h && h !== 'liste' ? unslug(h) : null, wide = WIDE.matches;
    if (id && !I[id]) id = null;
    if (sp || id || wide) {
      var show = id || st.current || DEFAULT;
      if (!wide && !$('home').hidden) listScroll = window.scrollY;
      if (sp) { $('detail').innerHTML = sp.html; }
      else { st.current = id ? show : st.current; renderDetail(show); }
      $('home').hidden = !wide; $('catrow').hidden = !wide; $('detail').hidden = false; $('backbtn').hidden = wide;
      document.title = sp ? sp.title + ' · Ressourcen-Lexikon' : (id ? nm(show) + ' · Ressourcen-Lexikon' : 'Ressourcen-Lexikon Bedrock');
      if (wide) { markCurrent(); if (id || sp) toDetailTop(); }
      else window.scrollTo(0, Math.max(0, $('detail').getBoundingClientRect().top + window.scrollY - barH() - 12));
    } else {
      var was = $('home').hidden;
      $('detail').hidden = true; $('home').hidden = false; $('catrow').hidden = false; $('backbtn').hidden = true;
      document.title = 'Ressourcen-Lexikon Bedrock';
      if (was) window.scrollTo(0, listScroll);
    }
  }
  function markCurrent() {
    [].forEach.call($('rows').querySelectorAll('a'), function (a) {
      if (a.getAttribute('href') === '#' + slug(st.current || '')) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
    });
  }
  var timer = null;
  function setQuery(v) {
    st.q = v; st.shown = 40; st.kb = -1;
    if (!WIDE.matches && !$('detail').hidden) { listScroll = 0; location.hash = 'liste'; }
    renderList();
    if (!WIDE.matches) { var y = $('home').getBoundingClientRect().top + window.scrollY - barH() - 12; if (window.scrollY > y) window.scrollTo(0, Math.max(0, y)); }
    else $('home').scrollTop = 0;
  }
  $('q').addEventListener('input', function () { var v = this.value; clearTimeout(timer); timer = setTimeout(function () { setQuery(v); }, 90); });
  $('clear').addEventListener('click', function () { $('q').value = ''; setQuery(''); $('q').focus(); });
  $('q').addEventListener('keydown', function (e) {
    var n = Math.min(st.shown, lastMatches.length);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      st.kb = Math.max(0, Math.min(n - 1, st.kb + (e.key === 'ArrowDown' ? 1 : -1)));
      renderList();
      var el = $('rows').querySelector('a.kb'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      var id = lastMatches[Math.max(0, st.kb)];
      if (id) { location.hash = slug(id); this.blur(); }
    } else if (e.key === 'Escape') {
      if (this.value) { this.value = ''; setQuery(''); } else this.blur();
    }
  });
  document.addEventListener('keydown', function (e) {
    var inField = e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
    if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !inField)) { e.preventDefault(); $('q').focus(); $('q').select(); }
  });
  $('cats').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    st.cat = +b.getAttribute('data-c'); st.shown = 40; st.kb = -1; renderCats(); renderList();
    if (WIDE.matches) $('home').scrollTop = 0;
  });
  $('more').addEventListener('click', function () { st.shown += 60; renderList(); });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (en) { if (en[0].isIntersecting && !$('more').hidden) { st.shown += 60; renderList(); } }, { rootMargin: '300px' }).observe($('more'));
  }
  $('detail').addEventListener('input', function (e) {
    if (e.target.id !== 'cq') return;
    var panel = e.target.closest('[data-calc]'); if (panel && e.target.value !== '') calcUpdate(panel, e.target.value);
  });
  $('detail').addEventListener('change', function (e) {
    if (e.target.id !== 'cq') return;
    var panel = e.target.closest('[data-calc]'); if (panel) e.target.value = calcUpdate(panel, e.target.value);
  });
  $('detail').addEventListener('click', function (e) {
    var tl = e.target.closest('[data-tolist]');
    if (tl) {
      var cp = tl.closest('[data-calc]'), cid = cp.getAttribute('data-calc'), cq = Math.max(1, Math.round(+cp.querySelector('#cq').value) || 1), L = appList();
      if (L) L.add(plan(cid, cq).leaves.map(function (l) { return { k: l[0], t: nm(l[0]), n: l[1] }; }), cq + ' × ' + nm(cid));
      return;
    }
    var stp = e.target.closest('[data-step]');
    if (stp) {
      var panel = stp.closest('[data-calc]'), inp = panel.querySelector('#cq'), step = +inp.step || 1;
      inp.value = calcUpdate(panel, Math.max(step, (+inp.value || 0) + (+stp.getAttribute('data-step')) * step));
      return;
    }
    var b = e.target.closest('[data-more]'); if (!b) return;
    [].forEach.call(b.parentNode.querySelectorAll('.xtra'), function (x) { x.hidden = false; });
    b.hidden = true;
  });
  window.addEventListener('hashchange', route);
  if (WIDE.addEventListener) WIDE.addEventListener('change', route); else if (WIDE.addListener) WIDE.addListener(route);

  $('eyebrow').textContent = 'Minecraft Bedrock Edition ' + pubver(D.v.version);
  $('lead').textContent = IDS.length.toLocaleString('de-DE') + ' Ressourcen mit ihren Originalnamen. Tippe eine an: Du siehst, woraus sie entsteht, wo du sie findest und wofür du sie brauchst.';
  $('foot').innerHTML = 'Namen, Rezepte, Beute und Handel stammen aus Mojangs offiziellen Beispieldaten zur Bedrock Edition ' + esc(pubver(D.v.version)) + ' (Datei ' + esc(D.v.version) + ')' +
    ' (<a href="https://github.com/Mojang/bedrock-samples">bedrock-samples</a>). Fundorte, Abbauregeln und einige Rezepte, die nicht in diesen Dateien stehen, sind von Hand ergänzt und können Fehler enthalten. Die Bilder sind Mojangs Originaltexturen aus demselben Repository. Sie stecken nicht in dieser Seite, sondern werden beim Anzeigen direkt von dort auf dein Gerät geladen. Ohne Verbindung zeigt das Lexikon farbige Plättchen.';

  function start(saved) {
    if (saved && typeof saved.q === 'string') { st.q = saved.q; $('q').value = saved.q; }
    if (saved && typeof saved.cat === 'number') st.cat = saved.cat;
    renderCats(); renderHero(); renderList(); route();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { q: st.q, cat: st.cat }; });
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
